<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="hm-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a877" />
      <stop offset="50%" stop-color="#00855d" />
      <stop offset="100%" stop-color="#006948" />
    </linearGradient>
    <linearGradient id="hm-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#85f8c4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00855d" stop-opacity="0.2" />
    </linearGradient>
    <filter id="hm-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#006948" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background soft glass container -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#hm-glow)" stroke="#85f8c4" stroke-width="1.2" stroke-opacity="0.4" filter="url(#hm-shadow)" />
  <!-- Heart & Cross / Spark Integration -->
  <path d="M20 31.5s-9.5-6.2-9.5-12.8a5.5 5.5 0 0 1 9.5-3.7 5.5 5.5 0 0 1 9.5 3.7c0 6.6-9.5 12.8-9.5 12.8z" fill="url(#hm-emerald)" />
  <!-- Vitality cross / pulse spark in crisp white -->
  <path d="M20 12.5v7m-3.5-3.5h7" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="20" cy="16" r="1.2" fill="#85f8c4" />
</svg>
